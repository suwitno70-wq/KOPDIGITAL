<style>
  :root {
    --green: #0D6E4E;
    --green-dark: #064E3B;
    --amber: #D97706;
    --bg: #F8FAFC;
    --border: #E2E8F0;
    --text: #0F172A;
    --muted: #64748B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background: #fff; border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
  .brand { font-size: 16px; font-weight: 800; color: var(--green); padding: 4px 10px 14px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .brand small { display: block; font-size: 10px; color: var(--amber); letter-spacing: 0.08em; }
  .nav-btn { width: 100%; text-align: left; padding: 10px 12px; border: none; border-radius: 8px; background: transparent; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer; }
  .nav-btn.active, .nav-btn:hover { background: #ECFDF5; color: var(--green); }
  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; padding-bottom: 72px; }
  .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 20; }
  .search-input { flex: 1; max-width: 420px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-outline { background: #fff; border-color: #CBD5E1; color: var(--text); }
  .content { padding: 20px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .hero { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; border-radius: 16px; padding: 26px; margin-bottom: 20px; }
  .hero h1 { font-size: 24px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .prod-price { font-family: monospace; font-size: 16px; font-weight: 800; color: var(--green); margin-top: 6px; }
  .kpi-val { font-family: monospace; font-size: 20px; font-weight: 800; color: var(--text); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 700; }
  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 6px; justify-content: space-around; z-index: 30; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-box { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 440px; }
  .input { width: 100%; padding: 9px 11px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 13px; margin-top: 4px; margin-bottom: 10px; }
  .hidden { display: none !important; }
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .bottom-nav { display: flex; }
  }
</style>
