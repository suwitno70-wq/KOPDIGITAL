<script>
  const state = {
    token: localStorage.getItem('kdp_gas_token') || '',
    user: null,
    anggota: null,
    produk: [],
    cart: []
  };

  function rupiah(n) {
    return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  }

  function bootstrap() {
    google.script.run.withSuccessHandler(function (res) {
      state.user = res.user;
      state.anggota = res.anggota;
      state.produk = res.produk || [];
      updateAuthUI();
      renderCatalog();
    }).getBootstrapData(state.token);
  }

  function updateAuthUI() {
    const btn = document.getElementById('btnAuth');
    document.querySelectorAll('.role-staff').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.role-admin').forEach(el => el.classList.add('hidden'));

    if (state.user) {
      btn.textContent = state.user.nama_lengkap + ' (Keluar)';
      btn.onclick = doLogout;
      if (state.user.role === 'ADMIN' || state.user.role === 'KASIR') {
        document.querySelectorAll('.role-staff').forEach(el => el.classList.remove('hidden'));
      }
      if (state.user.role === 'ADMIN') {
        document.querySelectorAll('.role-admin').forEach(el => el.classList.remove('hidden'));
      }
    } else {
      btn.textContent = 'Masuk';
      btn.onclick = openLoginModal;
    }
  }

  function renderCatalog() {
    const q = (document.getElementById('searchBox').value || '').toLowerCase();
    const grid = document.getElementById('catalogGrid');
    const list = state.produk.filter(p => !q || p.nama_produk.toLowerCase().includes(q));
    grid.innerHTML = list.map(p => {
      const harga = p.harga_promo > 0 ? p.harga_promo : p.harga_anggota;
      return `
        <div class="card">
          <div style="font-size:11px; color:#64748B;">${p.nama_kategori} · Stok ${p.stok}</div>
          <div style="font-weight:700; font-size:14px; margin-top:4px;">${p.nama_produk}</div>
          <div class="prod-price">${rupiah(harga)}</div>
          <div style="font-size:11px; color:#64748B; text-decoration:line-through;">${rupiah(p.harga_normal)}</div>
          <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addToCart('${p.id_produk}')">+ Keranjang</button>
        </div>
      `;
    }).join('');
  }

  function addToCart(idProduk) {
    const prod = state.produk.find(p => p.id_produk === idProduk);
    if (!prod) return;
    const found = state.cart.find(c => c.id_produk === idProduk);
    if (found) found.qty += 1;
    else state.cart.push({ id_produk: idProduk, nama: prod.nama_produk, harga: prod.harga_promo || prod.harga_anggota, qty: 1 });
    document.getElementById('cartCount').textContent = state.cart.reduce((s, c) => s + c.qty, 0);
  }

  function switchView(name, btn) {
    document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
    document.getElementById('view-' + name).classList.remove('hidden');
    if (btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    if (name === 'pesanan' && state.token) loadOrders();
    if (name === 'simpanan' && state.token) loadSimpanan();
    if (name === 'pinjaman' && state.token) loadPinjaman();
    if (name === 'admin' && state.token) loadAdmin();
  }

  function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
  function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

  function submitLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    google.script.run.withSuccessHandler(function (res) {
      state.token = res.token;
      localStorage.setItem('kdp_gas_token', res.token);
      closeLoginModal();
      bootstrap();
    }).withFailureHandler(err => alert(err.message)).loginUser(u, p);
  }

  function doLogout() {
    google.script.run.withSuccessHandler(function () {
      state.token = '';
      localStorage.removeItem('kdp_gas_token');
      bootstrap();
    }).logoutUser(state.token);
  }

  function openCartModal() {
    const box = document.getElementById('cartItemsBox');
    if (state.cart.length === 0) box.innerHTML = '<p>Keranjang kosong.</p>';
    else {
      const total = state.cart.reduce((s, c) => s + c.harga * c.qty, 0);
      box.innerHTML = state.cart.map(c => `<div>${c.nama} x${c.qty} — <b>${rupiah(c.harga * c.qty)}</b></div>`).join('') + `<hr style="margin:8px 0;"><div>Total: <b>${rupiah(total)}</b></div>`;
    }
    document.getElementById('cartModal').classList.remove('hidden');
  }
  function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

  function submitCheckout() {
    if (!state.token) { closeCartModal(); openLoginModal(); return; }
    const metode = document.getElementById('payMethod').value;
    google.script.run.withSuccessHandler(function (res) {
      state.cart = [];
      document.getElementById('cartCount').textContent = '0';
      closeCartModal();
      alert('Pesanan berhasil dibuat: ' + res.order.nomor_pesanan);
      bootstrap();
    }).withFailureHandler(err => alert(err.message)).checkoutOrder(state.token, {
      items: state.cart,
      metode_pembayaran: metode,
      channel: 'MARKETPLACE',
      idempotency_key: 'gas-' + Date.now()
    });
  }

  function loadOrders() {
    google.script.run.withSuccessHandler(function (orders) {
      document.getElementById('ordersList').innerHTML = orders.map(o =>
        `<div class="card" style="margin-bottom:10px;"><b>${o.nomor_pesanan}</b> · ${o.status_pesanan} · <b>${rupiah(o.total_bayar)}</b></div>`
      ).join('');
    }).getOrders(state.token);
  }

  function loadSimpanan() {
    google.script.run.withSuccessHandler(function (res) {
      document.getElementById('simpananContent').innerHTML = '<table><tr><th>No Transaksi</th><th>Anggota</th><th>Jenis</th><th>Tipe</th><th>Jumlah</th></tr>' +
        res.riwayat.map(r => `<tr><td>${r.nomor_transaksi}</td><td>${r.nama_anggota}</td><td>${r.jenis_simpanan}</td><td>${r.tipe}</td><td>${rupiah(r.jumlah)}</td></tr>`).join('') + '</table>';
    }).getSimpananData(state.token);
  }

  function loadPinjaman() {
    google.script.run.withSuccessHandler(function (res) {
      document.getElementById('pinjamanContent').innerHTML = res.pinjaman.map(p =>
        `<div class="card" style="margin-bottom:10px;"><b>${p.nomor_pinjaman}</b> · ${p.nama_anggota} · Sisa: <b>${rupiah(p.sisa_tagihan)}</b> (${p.status})</div>`
      ).join('');
    }).getPinjamanData(state.token);
  }

  function loadAdmin() {
    google.script.run.withSuccessHandler(function (res) {
      const s = res.stats;
      document.getElementById('adminStatsGrid').innerHTML = `
        <div class="card"><div>Total Anggota</div><div class="kpi-val">${s.totalAnggota}</div></div>
        <div class="card"><div>Total Produk</div><div class="kpi-val">${s.totalProduk}</div></div>
        <div class="card"><div>Total Simpanan</div><div class="kpi-val">${rupiah(s.totalSimpanan)}</div></div>
        <div class="card"><div>Saldo Kas</div><div class="kpi-val">${rupiah(s.totalKas)}</div></div>
        <div class="card"><div>SHU / Laba Bersih</div><div class="kpi-val">${rupiah(res.labaRugi.shuBersih)}</div></div>
      `;
    }).getAdminDashboardAndFinance(state.token);
  }

  window.addEventListener('DOMContentLoaded', bootstrap);
</script>
